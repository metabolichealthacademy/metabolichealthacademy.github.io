<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To‑do — Metabolic Health Academy (Demo)</title>
  <meta name="description" content="Simple to-do app (localStorage) demo for Metabolic Health Academy" />
  <!-- Tailwind CDN for quick styling in the demo -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex items-start justify-center py-12">
  <main class="w-full max-w-2xl bg-white rounded-lg shadow px-6 py-8">
    <header class="mb-6">
      <h1 class="text-2xl font-semibold">To‑do list (localStorage)</h1>
      <p class="text-sm text-gray-600">A small client-side to-do app that saves items in your browser. For demos and quick notes.</p>
    </header>

    <section class="mb-4">
      <form id="todo-form" class="flex gap-2">
        <label for="todo-input" class="sr-only">Add todo</label>
        <input id="todo-input" name="todo" type="text" placeholder="Add new task and press Enter" 
               class="flex-1 px-3 py-2 border border-gray-200 rounded focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">Add</button>
      </form>

      <div class="mt-3 flex items-center gap-3">
        <div class="flex items-center gap-2">
          <button data-filter="all" class="filter-btn px-3 py-1 rounded bg-gray-100 text-sm">All</button>
          <button data-filter="active" class="filter-btn px-3 py-1 rounded text-sm">Active</button>
          <button data-filter="completed" class="filter-btn px-3 py-1 rounded text-sm">Completed</button>
        </div>

        <input id="search" placeholder="Search…" class="ml-auto px-3 py-1 border rounded text-sm" />
      </div>
    </section>

    <section>
      <ul id="todo-list" class="space-y-2" aria-live="polite"></ul>

      <div class="mt-4 flex items-center justify-between text-sm text-gray-600">
        <div><span id="count">0</span> items</div>
        <div class="flex items-center gap-3">
          <button id="clear-completed" class="px-3 py-1 rounded text-sm text-red-600">Clear completed</button>
          <button id="export-json" class="px-3 py-1 rounded text-sm bg-gray-100">Export JSON</button>
          <button id="import-json" class="px-3 py-1 rounded text-sm bg-gray-100">Import JSON</button>
          <input id="import-file" type="file" accept="application/json" class="hidden" />
        </div>
      </div>
    </section>

    <footer class="mt-6 text-xs text-gray-500">
      Tip: This saves to your browser only. Use Export/Import to move tasks between devices.
    </footer>
  </main>

  <script src="/assets/js/todo.js"></script>
</body>
</html>
